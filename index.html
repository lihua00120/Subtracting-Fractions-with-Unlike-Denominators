<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>分數重疊實驗室</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 React 核心庫 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- 載入 Babel 以便在瀏覽器中直接編譯 JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* 確保基本字體與畫面高度正常 */
    body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">
  
  <!-- 應用程式會渲染在這個 div 裡面 -->
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const App = () => {
      const [mode, setMode] = useState('bar');
      const [n1, setN1] = useState(5);
      const [d1, setD1] = useState(6);
      const [n2, setN2] = useState(2);
      const [d2, setD2] = useState(3);
      const [isOverlay, setIsOverlay] = useState(false);
      const [isSubdivided, setIsSubdivided] = useState(false);

      const getLcm = (a, b) => {
        const gcd = (x, y) => (!y ? x : gcd(y, x % y));
        return (a * b) / gcd(a, b);
      };
      const commonD = getLcm(d1, d2);

      const handleD1Change = (val) => { setD1(val); setN1(Math.min(n1, val - 1)); setIsOverlay(false); setIsSubdivided(false); };
      const handleD2Change = (val) => { setD2(val); setN2(Math.min(n2, val - 1)); setIsOverlay(false); setIsSubdivided(false); };

      const polarToCartesian = (cx, cy, r, angleInDegrees) => {
        const angleInRadians = (angleInDegrees - 90) * (Math.PI / 180.0);
        return { x: cx + r * Math.cos(angleInRadians), y: cy + r * Math.sin(angleInRadians) };
      };

      const renderBar = (n, d, color, isTop) => {
        const width = 600;
        const height = 60;
        const parts = isSubdivided ? commonD : d;
        const activeParts = isSubdivided ? n * (commonD / d) : n;
        const rectWidth = width / parts;
        
        // 字體大小自動縮放
        const fontSize = Math.max(9, Math.min(18, rectWidth * 0.45));
        // 格子太窄時，文字轉直
        const isRotated = rectWidth < 35;

        return (
          <svg width="100%" viewBox={`0 0 ${width} ${height}`} className="mb-4">
            {Array.from({ length: parts }).map((_, i) => {
              const isActive = i < activeParts;
              const x = i * rectWidth;
              const cx = x + rectWidth / 2;
              const cy = height / 2;
              return (
                <g key={i}>
                  <rect x={x} y="0" width={rectWidth} height={height} fill={isActive ? color : 'white'} stroke="#333" strokeWidth="2" opacity={isOverlay && !isTop ? 0.6 : 1} />
                  <text
                    x={cx} y={cy} fill={isActive ? '#fff' : '#333'}
                    fontSize={fontSize} fontWeight="bold" textAnchor="middle" dominantBaseline="central"
                    transform={isRotated ? `rotate(-90, ${cx}, ${cy})` : ""}
                  >
                    1/{parts}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      };

      const renderCircle = (n, d, color, isTop) => {
        const cx = 100, cy = 100, r = 90;
        const parts = isSubdivided ? commonD : d;
        const activeParts = isSubdivided ? n * (commonD / d) : n;
        const anglePerPart = 360 / parts;
        // 如果切太細，文字向外推避免在圓心擠成一團
        const textRadiusRatio = parts > 15 ? 0.8 : 0.65;

        return (
          <svg width="240" viewBox="0 0 200 200" className="mx-auto">
            {Array.from({ length: parts }).map((_, i) => {
              const isActive = i < activeParts;
              const startAngle = i * anglePerPart;
              const endAngle = startAngle + anglePerPart;
              const start = polarToCartesian(cx, cy, r, endAngle);
              const end = polarToCartesian(cx, cy, r, startAngle);
              const largeArcFlag = anglePerPart <= 180 ? "0" : "1";
              const dPath = ["M", cx, cy, "L", start.x, start.y, "A", r, r, 0, largeArcFlag, 0, end.x, end.y, "Z"].join(" ");
              
              const midAngle = startAngle + anglePerPart / 2;
              const textPos = polarToCartesian(cx, cy, r * textRadiusRatio, midAngle);
              
              // 依據弧長計算字型大小
              const arcLength = (2 * Math.PI * (r * textRadiusRatio) * anglePerPart) / 360;
              const fontSize = Math.max(7, Math.min(14, arcLength * 0.7));
              
              // 計算文字旋轉角度，呈現放射狀且永遠正向
              let rotation = midAngle - 90;
              if (midAngle > 90 && midAngle <= 270) rotation += 180;

              return (
                <g key={i}>
                  <path d={dPath} fill={isActive ? color : 'white'} stroke="#333" strokeWidth="1.5" opacity={isOverlay && !isTop ? 0.6 : 1} />
                  <text
                    x={textPos.x} y={textPos.y} fill={isActive ? '#fff' : '#333'}
                    fontSize={fontSize} fontWeight="bold" textAnchor="middle" dominantBaseline="central"
                    transform={`rotate(${rotation}, ${textPos.x}, ${textPos.y})`}
                  >
                    1/{parts}
                  </text>
                </g>
              );
            })}
          </svg>
        );
      };

      return (
        <div className="max-w-4xl mx-auto p-6 bg-white rounded-xl shadow-lg mt-10">
          <h1 className="text-3xl font-bold text-center text-blue-600 mb-6">分數重疊實驗室</h1>
          
          <div className="flex justify-center gap-4 mb-8">
            <button onClick={() => setMode('bar')} className={`px-6 py-2 rounded-full font-bold ${mode === 'bar' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`}>線段模式</button>
            <button onClick={() => setMode('circle')} className={`px-6 py-2 rounded-full font-bold ${mode === 'circle' ? 'bg-blue-500 text-white' : 'bg-gray-200 text-gray-700'}`}>圓形模式</button>
          </div>

          <div className="grid grid-cols-2 gap-8 mb-8 bg-blue-50 p-6 rounded-lg">
            <div>
              <h3 className="text-xl font-bold mb-4 text-blue-700">被減數 (藍色)</h3>
              <div className="flex items-center gap-2 text-lg">
                分子: <input type="number" min="1" max={d1 - 1} value={n1} onChange={(e) => { setN1(Number(e.target.value)); setIsOverlay(false); setIsSubdivided(false); }} className="w-16 p-1 border rounded text-center" />
                / 分母: <input type="number" min="2" max="12" value={d1} onChange={(e) => handleD1Change(Number(e.target.value))} className="w-16 p-1 border rounded text-center" />
              </div>
            </div>
            <div>
              <h3 className="text-xl font-bold mb-4 text-orange-600">減數 (橘色)</h3>
              <div className="flex items-center gap-2 text-lg">
                分子: <input type="number" min="1" max={d2 - 1} value={n2} onChange={(e) => { setN2(Number(e.target.value)); setIsOverlay(false); setIsSubdivided(false); }} className="w-16 p-1 border rounded text-center" />
                / 分母: <input type="number" min="2" max="12" value={d2} onChange={(e) => handleD2Change(Number(e.target.value))} className="w-16 p-1 border rounded text-center" />
              </div>
            </div>
          </div>

          <div className="flex justify-center gap-4 mb-8">
            <button onClick={() => setIsOverlay(!isOverlay)} className="px-6 py-3 bg-purple-500 hover:bg-purple-600 text-white rounded-lg font-bold shadow-md transition-colors">
              {isOverlay ? '分開觀察' : '重疊觀察'}
            </button>
            <button onClick={() => setIsSubdivided(!isSubdivided)} className="px-6 py-3 bg-green-500 hover:bg-green-600 text-white rounded-lg font-bold shadow-md transition-colors">
              {isSubdivided ? '恢復原狀' : '共同細分'}
            </button>
          </div>

          <div className="relative border-4 border-dashed border-gray-200 p-8 rounded-xl bg-gray-50 min-h-[300px] flex flex-col items-center justify-center overflow-hidden">
            {mode === 'bar' ? (
              <div className="w-full relative">
                <div className={`transition-all duration-700 ${isOverlay ? 'absolute top-0 left-0 w-full z-20' : 'mb-8'}`}>
                  {renderBar(n1, d1, '#3b82f6', true)}
                </div>
                <div className={`transition-all duration-700 ${isOverlay ? 'absolute top-0 left-0 w-full z-10' : ''}`}>
                  {renderBar(n2, d2, '#f97316', false)}
                </div>
                {isOverlay && <div className="h-16 w-full"></div>}
              </div>
            ) : (
              <div className="relative w-[240px] h-[240px]">
                <div className={`transition-all duration-700 absolute top-0 left-0 w-full h-full ${isOverlay ? 'z-20' : 'transform -translate-x-32'}`}>
                  {renderCircle(n1, d1, '#3b82f6', true)}
                </div>
                <div className={`transition-all duration-700 absolute top-0 left-0 w-full h-full ${isOverlay ? 'z-10' : 'transform translate-x-32'}`}>
                  {renderCircle(n2, d2, '#f97316', false)}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    };

    // 將 App 渲染到畫面上
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
